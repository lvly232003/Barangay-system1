<nav class="navbar relative z-[60]">
  <div class="px-3 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between gap-2 sm:gap-3 h-16">
      <div class="flex items-center gap-2 min-w-0 flex-1">
        <button
          type="button"
          class="hamburger-btn"
          (click)="toggleMenu()"
          [attr.aria-expanded]="menuOpen"
          aria-label="Toggle navigation menu">
          <svg *ngIf="!menuOpen" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
          <svg *ngIf="menuOpen" class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
        <h1 class="text-base sm:text-xl font-bold gradient-text truncate">Admin Panel</h1>
      </div>

      <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
        <app-reminder-bell remindersPath="/admin/reminders"></app-reminder-bell>
        <app-theme-toggle></app-theme-toggle>

        <button
          type="button"
          (click)="navigateToProfile()"
          class="flex items-center gap-2 rounded-full hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
          title="Open profile">
          <div class="hidden md:block text-right">
            <div class="text-sm font-medium text-slate-900 dark:text-emerald-50 truncate max-w-[8rem] xl:max-w-none">
              Welcome, {{ currentUser?.firstName }} {{ currentUser?.lastName }}
            </div>
            <div class="text-xs muted-text truncate max-w-[8rem] xl:max-w-none">{{ currentUser?.email }}</div>
          </div>
          <div class="h-9 w-9 sm:h-10 sm:w-10 rounded-full bg-emerald-100 dark:bg-emerald-900 flex items-center justify-center shrink-0">
            <span class="text-sm font-medium text-emerald-700 dark:text-emerald-300">
              {{ currentUser?.firstName?.charAt(0) }}{{ currentUser?.lastName?.charAt(0) }}
            </span>
          </div>
        </button>

        <button type="button" (click)="logout()" class="lg:hidden btn-outline text-xs sm:text-sm px-2 py-1.5">Logout</button>

        <div class="hidden lg:flex items-center gap-2">
          <button type="button" (click)="navigateToProfile()" class="btn-outline text-sm px-3 py-2">Profile</button>
          <button type="button" (click)="navigateToDashboard()" class="btn-primary text-sm px-3 py-2">Dashboard</button>
          <button type="button" (click)="logout()" class="btn-outline text-sm px-3 py-2">Logout</button>
        </div>
      </div>
    </div>
  </div>
</nav>
