<div class="p-6">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-emerald-50">Settings</h1>
    <p class="text-gray-600 dark:text-emerald-200/70 mt-2">
      Configure system settings stored in Supabase (<code class="text-xs">system_settings</code>).
    </p>
  </div>

  <div *ngIf="loading" class="card text-center py-10 muted-text">Loading settings…</div>

  <div *ngIf="!loading" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
    <div class="card">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-emerald-50 mb-4">General Settings</h3>
      <form class="space-y-4" (ngSubmit)="saveSettings()">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Barangay Name</label>
          <input type="text" class="input-field" name="barangayName" [(ngModel)]="settings.barangayName" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Barangay Captain</label>
          <input type="text" class="input-field" name="barangayCaptain" [(ngModel)]="settings.barangayCaptain" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Barangay Secretary</label>
          <input type="text" class="input-field" name="barangaySecretary" [(ngModel)]="settings.barangaySecretary" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Contact Number</label>
          <input type="tel" class="input-field" name="contactPhone" [(ngModel)]="settings.contactPhone" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Contact Email</label>
          <input type="email" class="input-field" name="contactEmail" [(ngModel)]="settings.contactEmail" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Office Hours</label>
          <input type="text" class="input-field" name="officeHours" [(ngModel)]="settings.officeHours" />
        </div>

        <p *ngIf="message" class="text-sm text-emerald-600 dark:text-emerald-300">{{ message }}</p>
        <p *ngIf="error" class="text-sm text-rose-600 dark:text-rose-300">{{ error }}</p>

        <button type="submit" class="btn-primary" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save Settings' }}
        </button>
      </form>
    </div>

    <div class="card">
      <h3 class="text-lg font-semibold text-gray-900 dark:text-emerald-50 mb-4">System Preferences</h3>
      <div class="space-y-4">
        <label class="flex items-center justify-between gap-3 cursor-pointer">
          <span class="text-sm text-gray-700 dark:text-emerald-100/80">Email Notifications</span>
          <input type="checkbox" class="form-checkbox" name="emailNotifications" [(ngModel)]="settings.emailNotifications" />
        </label>
        <label class="flex items-center justify-between gap-3 cursor-pointer">
          <span class="text-sm text-gray-700 dark:text-emerald-100/80">SMS Notifications</span>
          <input type="checkbox" class="form-checkbox" name="smsNotifications" [(ngModel)]="settings.smsNotifications" />
        </label>
        <label class="flex items-center justify-between gap-3 cursor-pointer">
          <span class="text-sm text-gray-700 dark:text-emerald-100/80">Auto-approve Documents</span>
          <input type="checkbox" class="form-checkbox" name="autoApproveDocuments" [(ngModel)]="settings.autoApproveDocuments" />
        </label>
        <p class="text-xs muted-text">
          Preferences are saved with General Settings into Supabase.
        </p>
        <button type="button" class="btn-primary" (click)="saveSettings()" [disabled]="saving">
          {{ saving ? 'Saving…' : 'Save Preferences' }}
        </button>
      </div>
    </div>
  </div>
</div>
