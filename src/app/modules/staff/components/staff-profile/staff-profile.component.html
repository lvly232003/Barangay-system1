<div class="p-6">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900 dark:text-emerald-50">Staff Profile</h1>
    <p class="text-gray-600 dark:text-emerald-200/70 mt-2">Manage your staff information and password</p>
  </div>

  <div class="card mb-8">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-emerald-50 mb-6">Staff Information</h2>
    <form class="space-y-6" (ngSubmit)="updateProfile()">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">First Name</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.firstName" name="firstName" required />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Middle Name</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.middleName" name="middleName" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Last Name</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.lastName" name="lastName" required />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">
            Email
            <span class="ml-1 font-normal text-xs text-slate-500 dark:text-emerald-200/50">(cannot be changed here)</span>
          </label>
          <input type="email" class="input-field input-field-readonly" [(ngModel)]="staffProfile.email" name="email" readonly tabindex="-1" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Phone</label>
          <input type="tel" class="input-field" [(ngModel)]="staffProfile.phone" name="phone" />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Address</label>
        <textarea class="input-field resize-none" rows="2" [(ngModel)]="staffProfile.address" name="address"></textarea>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Position</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.position" name="position" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Department</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.department" name="department" />
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Employee ID</label>
          <input type="text" class="input-field" [(ngModel)]="staffProfile.employeeId" name="employeeId" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Hire Date</label>
          <input type="date" class="input-field" [(ngModel)]="staffProfile.hireDate" name="hireDate" />
        </div>
      </div>

      <p *ngIf="profileMessage" class="text-sm text-emerald-600 dark:text-emerald-300">{{ profileMessage }}</p>
      <p *ngIf="profileError" class="text-sm text-rose-600 dark:text-rose-300">{{ profileError }}</p>

      <div class="flex justify-end">
        <button type="submit" class="btn-primary" [disabled]="saving">
          {{ saving ? 'Saving...' : 'Update Profile' }}
        </button>
      </div>
    </form>
  </div>

  <div class="card">
    <h2 class="text-xl font-semibold text-gray-900 dark:text-emerald-50 mb-6">Change Password</h2>
    <form class="space-y-6 max-w-xl" (ngSubmit)="changePassword()">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Current Password</label>
        <input type="password" class="input-field" [(ngModel)]="passwordForm.currentPassword" name="currentPassword" required autocomplete="current-password" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">New Password</label>
        <input type="password" class="input-field" [(ngModel)]="passwordForm.newPassword" name="newPassword" required minlength="6" autocomplete="new-password" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-emerald-100/80 mb-2">Confirm New Password</label>
        <input type="password" class="input-field" [(ngModel)]="passwordForm.confirmPassword" name="confirmPassword" required minlength="6" autocomplete="new-password" />
      </div>

      <p *ngIf="passwordMessage" class="text-sm text-emerald-600 dark:text-emerald-300">{{ passwordMessage }}</p>
      <p *ngIf="passwordError" class="text-sm text-rose-600 dark:text-rose-300">{{ passwordError }}</p>

      <div class="flex justify-end">
        <button type="submit" class="btn-primary" [disabled]="changingPassword">
          {{ changingPassword ? 'Updating...' : 'Change Password' }}
        </button>
      </div>
    </form>
  </div>
</div>
