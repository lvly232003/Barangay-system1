<div class="reminder-bell relative shrink-0">
  <button
    type="button"
    class="reminder-bell__trigger relative inline-flex items-center justify-center h-10 w-10 rounded-lg border-2 border-emerald-600 text-emerald-700
      hover:bg-emerald-600 hover:text-white transition-colors
      dark:border-emerald-300 dark:text-emerald-100 dark:hover:bg-emerald-400 dark:hover:text-emerald-950
      focus:outline-none focus-visible:ring-2 focus-visible:ring-emerald-500"
    (click)="toggle(); $event.stopPropagation()"
    [attr.aria-expanded]="open"
    aria-label="Notifications"
    title="Notifications">
    <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V4a2 2 0 10-4 0v1.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
    </svg>
    <span
      *ngIf="badgeTotal > 0"
      class="absolute -top-1.5 -right-1.5 min-w-[1.15rem] h-[1.15rem] px-1 rounded-full text-[10px] font-bold leading-[1.15rem] text-center bg-rose-500 text-white shadow-sm">
      {{ badgeTotal > 99 ? '99+' : badgeTotal }}
    </span>
  </button>

  <!-- Mobile backdrop -->
  <div
    *ngIf="open && isMobile"
    class="fixed inset-0 z-[70] bg-slate-900/45 sm:hidden"
    (click)="close()"
    aria-hidden="true"></div>

  <div
    *ngIf="open"
    role="dialog"
    aria-label="Notifications"
    class="reminder-bell__panel z-[80] overflow-hidden rounded-xl border border-emerald-200 bg-white shadow-xl
      dark:border-emerald-800 dark:bg-surface-dark-elevated"
    [class.reminder-bell__panel--mobile]="isMobile"
    [class.reminder-bell__panel--desktop]="!isMobile"
    (click)="$event.stopPropagation()">
    <div class="px-4 py-3 border-b border-emerald-100 dark:border-emerald-900 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <p class="text-sm font-bold text-slate-900 dark:text-emerald-50">Notifications</p>
        <p class="text-xs muted-text truncate">
          {{ badgeTotal }} active reminder{{ badgeTotal === 1 ? '' : 's' }}
        </p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <button
          type="button"
          class="text-xs font-semibold text-emerald-700 dark:text-emerald-300 hover:underline disabled:opacity-40 disabled:no-underline"
          (click)="markAllAsRead($event)"
          [disabled]="!badgeTotal || markingAll"
          title="Mark all as read">
          {{ markingAll ? 'Marking…' : 'Mark all as read' }}
        </button>
        <button
          type="button"
          class="text-xs font-semibold text-emerald-700 dark:text-emerald-300 hover:underline"
          (click)="viewAll()">
          View all
        </button>
        <button
          type="button"
          class="sm:hidden inline-flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 hover:bg-emerald-50 dark:hover:bg-emerald-950/50"
          (click)="close()"
          aria-label="Close notifications">
          ×
        </button>
      </div>
    </div>

    <div class="reminder-bell__list overflow-y-auto overscroll-contain">
      <div *ngIf="reminders.length === 0" class="px-4 py-10 text-center text-sm muted-text">
        No pickup reminders right now.
      </div>

      <button
        type="button"
        *ngFor="let reminder of reminders"
        (click)="openReminder(reminder)"
        class="w-full text-left px-4 py-3.5 border-b border-emerald-50 dark:border-emerald-900/60
          hover:bg-emerald-50 dark:hover:bg-emerald-950/40 active:bg-emerald-100/70 transition-colors">
        <div class="flex items-start justify-between gap-3">
          <div class="min-w-0 flex-1">
            <span
              class="inline-block text-[10px] font-bold uppercase px-2 py-0.5 rounded-full mb-1"
              [ngClass]="urgencyClass(reminder.urgency)">
              {{ reminder.urgency }}
            </span>
            <p class="text-sm font-semibold text-slate-900 dark:text-emerald-50 break-words">{{ reminder.title }}</p>
            <p class="text-xs muted-text mt-0.5 line-clamp-2">{{ reminder.message }}</p>
            <p class="text-[11px] text-emerald-700 dark:text-emerald-300 mt-1 truncate">{{ reminder.reference }}</p>
          </div>
          <button
            type="button"
            class="text-[11px] font-medium text-slate-400 hover:text-rose-500 shrink-0 pt-0.5 min-h-[44px] sm:min-h-0 px-1"
            (click)="dismiss(reminder, $event)"
            title="Dismiss">
            Dismiss
          </button>
        </div>
      </button>
    </div>
  </div>
</div>
